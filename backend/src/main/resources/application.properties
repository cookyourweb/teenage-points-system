spring.application.name=points-api

# Mongo local. Para levantarlo:  docker run -d -p 27017:27017 --name mongo mongo:7
spring.data.mongodb.uri=mongodb://localhost:27017/points

# El JSON sale en camelCase igual que en TypeScript, y sin campos null:
# el frontend recibe exactamente la forma que ya conoce.
spring.jackson.default-property-inclusion=non_null

# /actuator/health para saber si esta vivo, igual que el /health del cv-server.
management.endpoints.web.exposure.include=health
