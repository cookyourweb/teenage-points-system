spring.application.name=points-api

# Mongo local. Para levantarlo:  docker run -d -p 27017:27017 --name mongo mongo:7
#
# OJO: en Spring Boot 4 la propiedad es spring.mongodb.uri, NO spring.data.mongodb.uri.
# La vieja se ignora sin avisar y entonces aplica el valor por defecto,
# mongodb://localhost/test, asi que los datos acaban en la base "test" y todo parece
# funcionar: la aplicacion arranca, guarda y lee. Solo esta escribiendo en otro sitio.
spring.mongodb.uri=mongodb://localhost:27017/points

# El JSON sale en camelCase igual que en TypeScript, y sin campos null:
# el frontend recibe exactamente la forma que ya conoce.
spring.jackson.default-property-inclusion=non_null

# /actuator/health para saber si esta vivo, igual que el /health del cv-server.
management.endpoints.web.exposure.include=health
